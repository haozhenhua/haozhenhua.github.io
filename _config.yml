title: 阅读过滤
tagline: haozhenhua 的个人阅读过滤与每日早报
description: 以博客形式过滤、摘要并编辑个人阅读的信息。每日整理公开来源的热门话题、主流媒体头条、金融市场与 Hacker News。
url: https://haozhenhua.github.io
baseurl: ""
timezone: Asia/Shanghai
lang: zh-CN
author: haozhenhua
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
highlighter: rouge
permalink: /:year/:month/:day/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore
  - docs
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
