title: OLLY早报
tagline: 每日信息整理，以及分期读一本书
description: OLLY早报：过滤、摘要并编辑日常阅读。每日整理公开来源的热点、主流媒体、金融市场与 Hacker News，并分期阅读软件工程著作。
url: https://haozhenhua.github.io
baseurl: ""
timezone: Asia/Shanghai
lang: zh-CN
author: haozhenhua
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
highlighter: rouge
permalink: /:year/:month/:day/:title/
future: true
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore
  - docs
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
